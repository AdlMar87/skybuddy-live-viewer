<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Skybuddy – Live-Flug</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#0c1726;color:#f2f7fb;font:16px system-ui,sans-serif}
header{padding:18px 18px 14px;background:#142337}
h1{font-size:21px;margin:0 0 9px;color:#71dccb}
#status{font-size:15px;line-height:1.5}#stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.stat{background:#1e3247;padding:10px 14px;border-radius:12px;min-width:110px}
.stat b{display:block;font-size:20px}.stat small{color:#bed1e1}
#map{height:calc(100dvh - 230px);min-height:300px;background:#182a3a}
footer{padding:12px 18px;color:#b6c7d5;font-size:12px;line-height:1.5}
</style></head><body>
<header><h1>🪂 Skybuddy Live-Flug</h1><div id="status" role="status">Flugstatus wird geladen …</div>
<div id="stats"><div class="stat"><small>Höhe</small><b id="alt">—</b></div>
<div class="stat"><small>Geschwindigkeit</small><b id="speed">—</b></div><div class="stat"><small>Steigen / Sinken</small><b id="climb">—</b></div></div></header>
<div id="map" aria-label="Live-Flugkarte"></div>
<footer>GPS-Daten können bei Funklöchern verzögert eintreffen. Keine Notruf- oder Rettungsfunktion. Der Pilot kann die Freigabe jederzeit beenden.</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
const token=new URLSearchParams(location.search).get('token')||'';
const status=document.getElementById('status');
const alt=document.getElementById('alt');
const speed=document.getElementById('speed');
const climb=document.getElementById('climb');
const valid=/^[a-f0-9]{64}$/.test(token);
const map=L.map('map').setView([47.2,9.7],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 attribution:'© OpenStreetMap contributors',maxZoom:18
}).addTo(map);
let marker=null,line=null,centered=false,lastGood=null;
function reset(){
 if(marker){map.removeLayer(marker);marker=null;}
 if(line){map.removeLayer(line);line=null;}
 alt.textContent=speed.textContent=climb.textContent='—';lastGood=null;centered=false;
}
async function refresh(){
 if(!valid){status.textContent='Ungültiger Tracking-Link.';return;}
 try{
 const response=await fetch('https://phxuztvjbvsxykzaedci.supabase.co/functions/v1/skybuddy-live?token='+encodeURIComponent(token),
 {cache:'no-store',referrerPolicy:'no-referrer'});
 if(!response.ok)throw Error('Datenabruf fehlgeschlagen');
 const data=await response.json();
 if(data.status!=='active'){
  reset();status.textContent='Aktuell kein freigegebener Flug.';return;
 }
 const age=data.last_at?Math.max(0,Math.round((Date.now()-Date.parse(data.last_at))/1000)):null;
 status.textContent=age===null?'Flug aktiv · Noch keine GPS-Position':
  (age>60?'⚠ Signal unterbrochen · ':'● Live · ')+
  'Letzte GPS-Position vor '+age+' Sekunden';
 alt.textContent=typeof data.altitude==='number'?Math.round(data.altitude)+' m':'—';
 speed.textContent=typeof data.speed==='number'?Math.round(data.speed)+' km/h':'—';
 const vertical=typeof data.climb==='number'?data.climb:null;
 climb.textContent=vertical===null?'—':(vertical>0?'+':'')+vertical.toFixed(1)+' m/s';
 climb.style.color=vertical===null?'#f2f7fb':vertical>0.1?'#71dccb':vertical< -0.1?'#ff9a9a':'#f2f7fb';
 if(typeof data.lat!=='number'||typeof data.lon!=='number')return;
 const point=[data.lat,data.lon];
 if(!marker)marker=L.marker(point).addTo(map);else marker.setLatLng(point);
 if(!centered){map.setView(point,13);centered=true;}
 const coords=(data.points||[]).filter(p=>typeof p.lat==='number'&&typeof p.lon==='number')
 .map(p=>[p.lat,p.lon]).reverse();
 if(line)map.removeLayer(line);
 if(coords.length>1)line=L.polyline(coords,{color:'#71dccb',weight:4}).addTo(map);
 lastGood=data.last_at;
 }catch(e){
  status.textContent='⚠ Verbindung unterbrochen – angezeigte Position möglicherweise veraltet.';
 }
}
refresh();setInterval(refresh,10000);
</script></body></html>
